name: Build Prism Client

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-prism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Client (x86_64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules to latest
        shell: pwsh
        run: |
          git submodule update --init --recursive --remote

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Prism Rust Core
        shell: pwsh
        run: |
          cd src/prism-rust
          cargo test
          cargo build --release
          cd ../..

      - name: Configure CMake
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCLIENT=ON `
            -DSERVER=OFF `
            -DTOOLS=OFF `
            -DVULKAN=OFF `
            -DVIDEORECORDER=OFF `
            -DDOWNLOAD_GTEST=OFF `
            -DAUTOUPDATE=OFF `
            -DSTEAM=OFF `
            -DDISCORD=OFF `
            -DCLIENT_EXECUTABLE=Prism

      - name: Build Prism Client
        run: cmake --build build --config Release --target game-client --parallel

      - name: Package Windows Distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Prism | Out-Null

          # Find and copy built client executable
          $exe = Get-ChildItem -Path build -Filter "Prism.exe" -Recurse -File | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path build -Filter "DDNet.exe" -Recurse -File | Select-Object -First 1
          }
          if (-not $exe) {
            $exe = Get-ChildItem -Path build -Filter "game-client.exe" -Recurse -File | Select-Object -First 1
          }
          if ($exe) {
            Copy-Item $exe.FullName dist/Prism/Prism.exe -Force
            Write-Host "Found executable: $($exe.FullName)"
          } else {
            Write-Error "Could not find built client executable!"
            exit 1
          }

          # Copy DLLs from ddnet-libs and build output
          if (Test-Path ddnet-libs) {
            Get-ChildItem -Path ddnet-libs -Filter "*.dll" -Recurse -File | Where-Object { $_.FullName -like "*windows*lib64*" } | ForEach-Object {
              Copy-Item $_.FullName dist/Prism/ -Force
            }
          }
          if (Test-Path build) {
            Get-ChildItem -Path build -Filter "*.dll" -Recurse -File | ForEach-Object {
              Copy-Item $_.FullName dist/Prism/ -Force
            }
          }

          # Copy data assets (fonts, tclient assets, themes, skins, mapres)
          Copy-Item -Path data -Destination dist/Prism/ -Recurse -Force

          # Copy config & license
          if (Test-Path storage.cfg) { Copy-Item storage.cfg dist/Prism/ }
          if (Test-Path license.txt) { Copy-Item license.txt dist/Prism/ }

          # Compress to zip
          Compress-Archive -Path dist/Prism/* -DestinationPath dist/Prism-Windows-x64.zip -Force
          Write-Host "Created dist/Prism-Windows-x64.zip successfully!"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Windows-x64
          path: dist/Prism-Windows-x64.zip
          if-no-files-found: error

      - name: Publish Windows Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Prism-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux Client (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            libsdl2-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libpng-dev \
            libsqlite3-dev \
            libogg-dev \
            libopus-dev \
            libopusfile-dev \
            libglew-dev \
            libnotify-dev \
            libwavpack-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Prism Rust Core
        run: |
          cd src/prism-rust
          cargo test
          cargo build --release
          cd ../..

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIENT=ON \
            -DSERVER=OFF \
            -DTOOLS=OFF \
            -DVULKAN=OFF \
            -DVIDEORECORDER=OFF \
            -DDOWNLOAD_GTEST=OFF \
            -DAUTOUPDATE=OFF \
            -DSTEAM=OFF \
            -DDISCORD=OFF \
            -DCLIENT_EXECUTABLE=Prism

      - name: Build Prism Client
        run: cmake --build build --config Release --target game-client --parallel

      - name: Package Linux Distribution
        run: |
          mkdir -p dist/Prism
          EXE=$(find build -maxdepth 3 -type f \( -name "Prism" -o -name "DDNet" -o -name "game-client" \) | grep -v "\.dir" | head -n 1)
          if [ -n "$EXE" ]; then
            cp "$EXE" dist/Prism/Prism
            chmod +x dist/Prism/Prism
            echo "Found binary: $EXE"
          else
            echo "ERROR: Client binary not found!"
            exit 1
          fi
          cp -r data dist/Prism/
          [ -f storage.cfg ] && cp storage.cfg dist/Prism/
          [ -f license.txt ] && cp license.txt dist/Prism/
          cd dist
          tar -czvf Prism-Linux-x86_64.tar.gz Prism
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Linux-x86_64
          path: dist/Prism-Linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish Linux Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Prism-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
