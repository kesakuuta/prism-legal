
name: Build Prism Client

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prism-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 — Build, Tests and Package
    runs-on: windows-2022
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCLIENT=ON `
            -DSERVER=OFF `
            -DTOOLS=OFF `
            -DVULKAN=OFF `
            -DDOWNLOAD_GTEST=ON `
            -DAUTOUPDATE=OFF `
            -DSTEAM=OFF `
            -DDISCORD=OFF `
            -DCLIENT_EXECUTABLE=Prism

      - name: Build Debug
        run: cmake --build build --config Debug --target game-client testrunner --parallel 4

      - name: Run Debug C++ Tests
        run: cmake --build build --config Debug --target run_cxx_tests

      - name: Build Release
        run: cmake --build build --config Release --target game-client testrunner --parallel 4

      - name: Run Release C++ and Rust Tests
        run: cmake --build build --config Release --target run_tests

      - name: Build Portable Distribution
        run: cmake --build build --config Release --target package_default --parallel 4

      - name: Verify Distribution
        env:
          PRISM_EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/package_prism.py build

      - name: Smoke Test
        run: python scripts/smoke_prism.py build/verified-package/Prism

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/prism-windows-x64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
