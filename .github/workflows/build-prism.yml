name: Build chroma. Client

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-prism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Client (x86_64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules to latest
        shell: pwsh
        run: |
          git submodule update --init --recursive --remote

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Prism Rust Core
        shell: pwsh
        run: |
          cd src/prism-rust
          cargo test
          cargo build --release
          cd ../..

      - name: Configure CMake
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCLIENT=ON `
            -DSERVER=ON `
            -DTOOLS=OFF `
            -DVULKAN=OFF `
            -DVIDEORECORDER=OFF `
            -DDOWNLOAD_GTEST=OFF `
            -DAUTOUPDATE=OFF `
            -DSTEAM=OFF `
            -DDISCORD=OFF `
            -DCLIENT_EXECUTABLE=Prism

      - name: Build chroma. Client & Server
        run: cmake --build build --config Release --target game-client game-server --parallel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build chroma. Launcher
        shell: bash
        run: |
          cargo build --release --package chroma-launcher

      - name: Package Windows Distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Prism | Out-Null

          # Find and copy built client executable
          $exe = Get-ChildItem -Path build -Filter "Prism.exe" -Recurse -File | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path build -Filter "DDNet.exe" -Recurse -File | Select-Object -First 1
          }
          if (-not $exe) {
            $exe = Get-ChildItem -Path build -Filter "game-client.exe" -Recurse -File | Select-Object -First 1
          }
          if ($exe) {
            Copy-Item $exe.FullName dist/Prism/chroma.exe -Force
            Copy-Item $exe.FullName dist/Prism/Prism.exe -Force
            Write-Host "Found client executable: $($exe.FullName), copied as chroma.exe and Prism.exe"
          } else {
            Write-Error "Could not find built client executable!"
            exit 1
          }

          # Copy built launcher executable
          if (Test-Path "target/release/chroma-launcher.exe") {
            Copy-Item "target/release/chroma-launcher.exe" "dist/Prism/chroma-launcher.exe" -Force
            Copy-Item "target/release/chroma-launcher.exe" "dist/Prism/launcher.exe" -Force
            Write-Host "Found launcher executable in target/release, copied to dist/Prism"
          } elseif (Test-Path "launcher/target/release/chroma-launcher.exe") {
            Copy-Item "launcher/target/release/chroma-launcher.exe" "dist/Prism/chroma-launcher.exe" -Force
            Copy-Item "launcher/target/release/chroma-launcher.exe" "dist/Prism/launcher.exe" -Force
            Write-Host "Found launcher executable in launcher/target/release, copied to dist/Prism"
          }

          # Find and copy built server executable
          $serverExe = Get-ChildItem -Path build -Filter "DDNet-Server.exe" -Recurse -File | Select-Object -First 1
          if (-not $serverExe) {
            $serverExe = Get-ChildItem -Path build -Filter "game-server.exe" -Recurse -File | Select-Object -First 1
          }
          if ($serverExe) {
            Copy-Item $serverExe.FullName dist/Prism/DDNet-Server.exe -Force
            Write-Host "Found server executable: $($serverExe.FullName)"
          } else {
            Write-Warning "Could not find built server executable!"
          }

          # Copy DLLs from ddnet-libs and build output
          if (Test-Path ddnet-libs) {
            Get-ChildItem -Path ddnet-libs -Filter "*.dll" -Recurse -File | Where-Object { $_.FullName -like "*windows*lib64*" } | ForEach-Object {
              Copy-Item $_.FullName dist/Prism/ -Force
            }
          }
          if (Test-Path build) {
            Get-ChildItem -Path build -Filter "*.dll" -Recurse -File | ForEach-Object {
              Copy-Item $_.FullName dist/Prism/ -Force
            }
          }

          # Copy data assets (fonts, tclient assets, themes, skins, mapres)
          Copy-Item -Path data -Destination dist/Prism/ -Recurse -Force

          # Copy config & license
          if (Test-Path storage.cfg) { Copy-Item storage.cfg dist/Prism/ }
          if (Test-Path license.txt) { Copy-Item license.txt dist/Prism/ }

          # Compress to zip for GitHub Releases
          Compress-Archive -Path dist/Prism/* -DestinationPath dist/chroma.-Windows-x64.zip -Force
          Write-Host "Created dist/chroma.-Windows-x64.zip successfully!"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chroma.-Windows-x64
          path: dist/Prism
          if-no-files-found: error

  build-linux:
    name: Linux Client (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            libsdl2-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libpng-dev \
            libsqlite3-dev \
            libogg-dev \
            libopus-dev \
            libopusfile-dev \
            libglew-dev \
            libnotify-dev \
            libwavpack-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Prism Rust Core
        run: |
          cd src/prism-rust
          cargo test
          cargo build --release
          cd ../..

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIENT=ON \
            -DSERVER=ON \
            -DTOOLS=OFF \
            -DVULKAN=OFF \
            -DVIDEORECORDER=OFF \
            -DDOWNLOAD_GTEST=OFF \
            -DAUTOUPDATE=OFF \
            -DSTEAM=OFF \
            -DDISCORD=OFF \
            -DCLIENT_EXECUTABLE=Prism

      - name: Build chroma. Client & Server
        run: cmake --build build --config Release --target game-client game-server --parallel

      - name: Package Linux Distribution
        run: |
          mkdir -p dist/Prism
          EXE=$(find build -maxdepth 3 -type f \( -name "Prism" -o -name "DDNet" -o -name "game-client" \) | grep -v "\.dir" | head -n 1)
          if [ -n "$EXE" ]; then
            cp "$EXE" dist/Prism/chroma
            cp "$EXE" dist/Prism/Prism
            chmod +x dist/Prism/chroma dist/Prism/Prism
            echo "Found binary: $EXE (copied as chroma and Prism)"
          else
            echo "ERROR: Client binary not found!"
            exit 1
          fi
          SERVER_EXE=$(find build -maxdepth 3 -type f \( -name "DDNet-Server" -o -name "game-server" \) | grep -v "\.dir" | head -n 1)
          if [ -n "$SERVER_EXE" ]; then
            cp "$SERVER_EXE" dist/Prism/DDNet-Server
            chmod +x dist/Prism/DDNet-Server
            echo "Found server binary: $SERVER_EXE"
          fi
          cp -r data dist/Prism/
          [ -f storage.cfg ] && cp storage.cfg dist/Prism/
          [ -f license.txt ] && cp license.txt dist/Prism/
          cd dist
          tar -czvf chroma.-Linux-x86_64.tar.gz Prism
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chroma.-Linux-x86_64
          path: dist/Prism
          if-no-files-found: error

  release:
    name: Automatic GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: chroma.-Windows-x64
          path: artifacts/Prism-Windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: chroma.-Linux-x86_64
          path: artifacts/Prism-Linux

      - name: Package Release Archives
        run: |
          mkdir -p release-assets
          cd artifacts/Prism-Windows
          zip -r ../../release-assets/chroma.-Windows-x64.zip .
          if [ -f chroma-launcher.exe ]; then
            cp chroma-launcher.exe ../../release-assets/chroma-launcher.exe
          fi
          cd ../../artifacts/Prism-Linux
          tar -czvf ../../release-assets/chroma.-Linux-x86_64.tar.gz .
          cd ../..

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.8"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=chroma. $TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish Automated Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          files: |
            release-assets/chroma.-Windows-x64.zip
            release-assets/chroma.-Linux-x86_64.tar.gz
            release-assets/chroma-launcher.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
