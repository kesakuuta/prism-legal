name: Build Prism Client

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-prism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Client (x86_64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Prism Rust Core
        shell: pwsh
        run: |
          cd src/prism-rust
          cargo test
          cargo build --release
          cd ../..

      - name: Configure CMake
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCLIENT=ON `
            -DSERVER=OFF `
            -DTOOLS=OFF `
            -DVULKAN=OFF `
            -DDOWNLOAD_GTEST=OFF `
            -DAUTOUPDATE=OFF `
            -DSTEAM=OFF `
            -DDISCORD=OFF `
            -DCLIENT_EXECUTABLE=Prism

      - name: Build Prism Client
        run: cmake --build build --config Release --target Prism --parallel

      - name: Package Windows Distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Prism | Out-Null

          # Copy executable
          if (Test-Path build/Release/Prism.exe) {
            Copy-Item build/Release/Prism.exe dist/Prism/
          } elseif (Test-Path build/Release/DDNet.exe) {
            Copy-Item build/Release/DDNet.exe dist/Prism/Prism.exe
          } elseif (Test-Path build/Prism.exe) {
            Copy-Item build/Prism.exe dist/Prism/
          }

          # Copy DLLs from ddnet-libs
          if (Test-Path ddnet-libs) {
            Get-ChildItem -Path ddnet-libs -Filter "*.dll" -Recurse | Where-Object { $_.FullName -like "*windows*lib64*" } | ForEach-Object {
              Copy-Item $_.FullName dist/Prism/ -Force
            }
          }
          if (Test-Path build/Release/*.dll) {
            Copy-Item build/Release/*.dll dist/Prism/ -Force
          }

          # Copy data assets (fonts, tclient assets, themes, skins)
          Copy-Item -Path data -Destination dist/Prism/ -Recurse -Force

          # Copy config & license
          if (Test-Path storage.cfg) { Copy-Item storage.cfg dist/Prism/ }
          if (Test-Path license.txt) { Copy-Item license.txt dist/Prism/ }

          # Compress to zip
          Compress-Archive -Path dist/Prism/* -DestinationPath dist/Prism-Windows-x64.zip -Force
          Write-Host "Created dist/Prism-Windows-x64.zip successfully!"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Windows-x64
          path: dist/Prism-Windows-x64.zip
          if-no-files-found: error

      - name: Publish Windows Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Prism-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux Client (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            libsdl2-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libpng-dev \
            libsqlite3-dev \
            libogg-dev \
            libopus-dev \
            libopusfile-dev \
            libglew-dev \
            libnotify-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Prism Rust Core
        run: |
          cd src/prism-rust
          cargo test
          cargo build --release
          cd ../..

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIENT=ON \
            -DSERVER=OFF \
            -DTOOLS=OFF \
            -DVULKAN=OFF \
            -DDOWNLOAD_GTEST=OFF \
            -DAUTOUPDATE=OFF \
            -DSTEAM=OFF \
            -DDISCORD=OFF \
            -DCLIENT_EXECUTABLE=Prism

      - name: Build Prism Client
        run: cmake --build build --target Prism

      - name: Package Linux Distribution
        run: |
          mkdir -p dist/Prism
          if [ -f build/Prism ]; then
            cp build/Prism dist/Prism/
          elif [ -f build/DDNet ]; then
            cp build/DDNet dist/Prism/Prism
          fi
          chmod +x dist/Prism/Prism
          cp -r data dist/Prism/
          [ -f storage.cfg ] && cp storage.cfg dist/Prism/
          [ -f license.txt ] && cp license.txt dist/Prism/
          cd dist
          tar -czvf Prism-Linux-x86_64.tar.gz Prism
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Linux-x86_64
          path: dist/Prism-Linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish Linux Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Prism-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
